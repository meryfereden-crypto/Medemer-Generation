`;

        const quizQuestions = [];
        
        function parseRawData() {
            // Split based on regex looking for "number dot space"
            const blocks = rawTextData.trim().split(/(?:^|\n)(?=\d+\.\s)/);
            blocks.forEach(block => {
                if (!block.trim()) return;
                const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
                const qLine = lines[0].replace(/^\d+\.\s*/, '');
                
                const options = [];
                let ansIdx = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    if (/^[A-D]\)/.test(lines[i])) {
                        options.push(lines[i].replace(/^[A-D]\)\s*/, ''));
                    } else if (lines[i].includes('መልስ:')) {
                        const char = lines[i].split('መልስ:')[1].trim().charAt(0);
                        if (char === 'A') ansIdx = 0;
                        else if (char === 'B') ansIdx = 1;
                        else if (char === 'C') ansIdx = 2;
                        else if (char === 'D') ansIdx = 3;
                    }
                }
                
                if (qLine && options.length > 0) {
                    quizQuestions.push({
                        q: qLine,
                        options: options,
                        answer: ansIdx,
                        // Generating a detailed Amharic explanation wrapping the correct answer
                        explanation: `ትክክለኛው መልስ <strong>'${options[ansIdx]}'</strong> ነው። ይህ ምርጫ በመጽሐፉ ውስጥ የተገለጹትን የመደመር እሳቤ፣ የትውልድ ታሪክ፣ እና ሀገራዊ ትርክቶችን መሰረት አድርጎ የቀረበ ትክክለኛ ምላሽ ነው። አጥጋቢ ግንዛቤ ለማግኘት የቀረበውን ጽንሰ-ሀሳብ ማስተዋል ጠቃሚ ነው።`
                    });
                }
            });
        }
        parseRawData();

        // --- 2. Application State ---
        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";
        let studentId = "";
        let userAnswers = new Array(quizQuestions.length).fill(null);

        // --- 3. DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const nameInput = document.getElementById('student-name');
        const idInput = document.getElementById('student-id');
        const errorMsg = document.getElementById('error-msg');
        
        const displayName = document.getElementById('display-name');
        const displayId = document.getElementById('display-id');
        const currentQNum = document.getElementById('current-q-num');
        const totalQNum = document.getElementById('total-q-num');
        const progressBar = document.getElementById('progress-bar');
        
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const nextBtnText = document.getElementById('next-btn-text');

        // --- 4. Logic & Event Listeners ---
        totalQNum.textContent = quizQuestions.length;

        startBtn.addEventListener('click', () => {
            studentName = nameInput.value.trim();
            studentId = idInput.value.trim();
            if (studentName === "" || studentId === "") {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');
            displayName.textContent = studentName;
            displayId.textContent = studentId;
            
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            renderQuestion();
        });

        function renderQuestion() {
            const q = quizQuestions[currentQuestionIndex];
            currentQNum.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / quizQuestions.length) * 100}%`;
            
            questionText.textContent = `${currentQuestionIndex + 1}. ${q.q}`;
            optionsContainer.innerHTML = '';
            feedbackArea.classList.add('hidden');
            
            const answeredOption = userAnswers[currentQuestionIndex];
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 font-medium text-gray-700 bg-white flex items-center justify-between group`;
                btn.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center mr-4 font-bold group-hover:bg-indigo-100 group-hover:text-indigo-600 transition">${String.fromCharCode(65 + idx)}</span>
                        <span>${opt}</span>
                    </div>
                `;
                
                if (answeredOption === null) {
                    btn.classList.add('hover:border-indigo-500', 'border-gray-200');
                    btn.onclick = () => handleAnswer(idx);
                } else {
                    btn.disabled = true;
                    // Styling for already answered
                    if (idx === q.answer) {
                        btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 font-medium bg-green-50 border-green-500 text-green-800 flex items-center justify-between`;
                        btn.innerHTML += `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                        // Change icon style
                        btn.querySelector('span.w-8').className = "w-8 h-8 rounded-full bg-green-200 text-green-700 flex items-center justify-center mr-4 font-bold";
                    } else if (idx === answeredOption) {
                        btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 font-medium bg-red-50 border-red-500 text-red-800 flex items-center justify-between`;
                        btn.innerHTML += `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        // Change icon style
                        btn.querySelector('span.w-8').className = "w-8 h-8 rounded-full bg-red-200 text-red-700 flex items-center justify-center mr-4 font-bold";
                    } else {
                        btn.classList.add('border-gray-200', 'opacity-50');
                    }
                }
                optionsContainer.appendChild(btn);
            });

            // Adjust Footer buttons
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (answeredOption !== null) {
                showFeedback(answeredOption === q.answer, q.explanation);
                nextBtnText.textContent = currentQuestionIndex === quizQuestions.length - 1 ? "ጨርስ (Submit)" : "ቀጣይ (Next)";
                nextBtn.classList.replace('bg-indigo-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-green-700');
            } else {
                nextBtnText.textContent = "ዝለል (Skip)";
                nextBtn.classList.replace('bg-green-600', 'bg-indigo-600');
                nextBtn.classList.replace('hover:bg-green-700', 'hover:bg-indigo-700');
            }
        }

        function handleAnswer(selectedIndex) {
            const q = quizQuestions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;
            
            if (selectedIndex === q.answer) {
                score++;
            }
            
            renderQuestion(); // Re-render to show styling and disable buttons
        }

        function showFeedback(isCorrect, explanationStr) {
            feedbackArea.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200');
            feedbackArea.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');
            feedbackArea.classList.add(isCorrect ? 'border-green-200' : 'border-red-200');
            
            if (isCorrect) {
                feedbackIcon.innerHTML = `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                feedbackTitle.textContent = "ትክክል ነዎት! (Correct)";
                feedbackTitle.className = "font-bold text-lg text-green-700";
            } else {
                feedbackIcon.innerHTML = `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                feedbackTitle.textContent = "ተሳስተዋል (Incorrect)";
                feedbackTitle.className = "font-bold text-lg text-red-700";
            }
            
            feedbackExplanation.innerHTML = explanationStr;
            feedbackExplanation.className = `mt-1 text-sm md:text-base leading-relaxed ${isCorrect ? 'text-green-800' : 'text-red-800'}`;
        }

        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('result-name').textContent = studentName;
            document.getElementById('result-id').textContent = `ID: ${studentId}`;
            
            document.getElementById('score-points').textContent = score;
            const percentage = Math.round((score / quizQuestions.length) * 100);
            const pElem = document.getElementById('score-percentage');
            pElem.textContent = `${percentage}%`;
            
            if (percentage >= 80) pElem.className = "text-lg font-bold text-green-500 mt-2";
            else if (percentage >= 50) pElem.className = "text-lg font-bold text-yellow-500 mt-2";
            else pElem.className = "text-lg font-bold text-red-500 mt-2";
        }

        document.getElementById('email-btn').addEventListener('click', () => {
            const percentage = Math.round((score / quizQuestions.length) * 100);
            const subject = encodeURIComponent(`የመደመር ፈተና ውጤት - ${studentName}`);
            const body = encodeURIComponent(`ሰላም! የፈተናው ውጤት ዝርዝር ከዚህ በታች ቀርቧል።\n\nሙሉ ስም: ${studentName}\nመታወቂያ ቁጥር: ${studentId}\nአጠቃላይ ውጤት: ${score} / ${quizQuestions.length} (${percentage}%)\n\nበመደመር ትውልድ የጥያቄና መልስ መተግበሪያ የተላከ።`);
            window.location.href = `mailto:mesayferedegn2@gmail.com?subject=${subject}&body=${body}`;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            userAnswers.fill(null);
            
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            
            nameInput.value = "";
            idInput.value = "";
            studentName = "";
            studentId = "";
        });

    </script>
</body>
</html>
